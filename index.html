<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- services -->
        <script src="js/services/gallery.service.js" defer></script>
        <script src="js/services/main.service.js" defer></script>

        <!-- controllers -->
        <script src="js/controllers/main.controller.js" defer></script>
        <script src="js/controllers/gallery.controller.js" defer></script>

        <!-- CSS -->
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/gallery.css" />
        <link rel="stylesheet" href="css/meme-editor.css" />

        <!-- Font Awesome Link -->
        <script src="fontawesome-free-7.2.0-web/js/solid.js" defer></script>
        <script src="fontawesome-free-7.2.0-web/js/fontawesome.js" defer></script>

        <title>Meme Generator</title>
    </head>
    <body>
        <nav>
            <h1>MEME GEN</h1>
            <div class="nav-links">
                <p onclick="onChangePage('gallery-page')">Gallery</p>
                <p>About</p>
            </div>
        </nav>
        <main>
            <div class="gallery-page">
                <div class="gallery-nav">
                    <label for="search-input">Search</label>
                    <input type="text" id="search-input" placeholder="Hmmm..." />
                    <div class="keywords-container">
                        <span>Funny</span>
                        <span>Cat</span>
                        <span>President</span>
                        <span>Bibi</span>
                        <span>Horse</span>
                        <span>Joke</span>
                    </div>
                </div>
                <div class="images-container">
                    <div class="gallery-item"><img src="images/1.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/2.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/3.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/4.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/5.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/6.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/7.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/8.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/9.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/10.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/11.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/12.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/13.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/14.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/15.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/16.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/17.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/18.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/19.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/20.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/21.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/22.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/23.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/24.jpg" alt="" /></div>
                    <div class="gallery-item"><img src="images/25.jpg" alt="" /></div>
                </div>
            </div>
            <div class="meme-editor-page hidden">
                <div class="meme-editor-container">
                    <section class="meme-preview">
                        <canvas width="500px" height="500px"></canvas>
                    </section>
                    <section class="meme-controls">
                        <div class="text-inputs">
                            <input type="text" /><input type="text" /><input type="text" />
                            <button class="add-text-button">Add More Text...</button>
                        </div>

                        <div class="text-properties-editor">
                            <button class="increase-font-size-button">
                                <i class="fa-solid fa-a"></i>
                            </button>
                            <button class="decrease-font-size-button">
                                <i class="fa-solid fa-a"></i>
                            </button>
                            <button class="align-text-left-button">
                                <i class="fa-solid fa-align-left"></i>
                            </button>
                            <button class="align-text-center-button">
                                <i class="fa-solid fa-align-center"></i>
                            </button>
                            <button class="align-text-right-button">
                                <i class="fa-solid fa-align-right"></i>
                            </button>
                            <button class="justify-text-left-button">
                                <i class="fa-solid fa-up-down"></i>
                            </button>
                            <label for="text-font-select">Select Font</label>
                            <select name="text-font-select" id="">
                                <option value="Arial">Arial</option>
                                <option value="Impact">Impact</option>
                                <option value="Monospace">Monospace</option>
                            </select>
                        </div>

                        <div class="stikers"></div>
                    </section>
                </div>
            </div>
            <div class="about-page"></div>
        </main>
        <footer></footer>
    </body>
</html>
